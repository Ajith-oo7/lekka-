name: lekka
description: Lekka - a clear digital record of each loan.
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: ^3.5.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  supabase_flutter: ^2.9.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  # Push notifications (Phase 5). firebase_core is required by firebase_messaging.
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true
